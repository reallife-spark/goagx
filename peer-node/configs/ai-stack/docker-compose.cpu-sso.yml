# Federated admin ingress overlay for the CPU llama.cpp peer stack (0003).
#
# The CPU stack publishes Open WebUI directly on 8181 and has no nginx sidecar.
# This overlay keeps that user surface and adds a separate admin-only ingress on
# 8182. The admin ingress proxies to the published 8181 and trusts the auth
# gateway's headers.
#
#   SPARKNET_IDENTITY_DIR=... SPARKNET_ADMIN_BIND=10.100.0.3:8182 \
#   SPARKNET_ADMIN_ALT_BIND=192.168.30.140:8182 \
#   docker compose -f docker-compose.cpu-llamacpp.yml -f docker-compose.cpu-sso.yml up -d
services:
  open-webui:
    environment:
      WEBUI_AUTH_TRUSTED_EMAIL_HEADER: "X-User-Email"
      WEBUI_AUTH_TRUSTED_ROLE_HEADER: "X-User-Role"
      WEBUI_AUTH_TRUSTED_GROUPS_HEADER: "X-User-Groups"
      ENABLE_LOGIN_FORM: "true"
      ENABLE_PASSWORD_AUTH: "true"


  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:${OAUTH2_PROXY_TAG:-v7.6.0}
    container_name: sparknet-oauth2-proxy
    restart: unless-stopped
    # Loopback only. The admin ingress calls /oauth2/auth; nginx proxies the
    # browser through /oauth2/start and /oauth2/callback.
    network_mode: host
    env_file:
      - ${SPARKNET_OAUTH2_ENV:?set SPARKNET_OAUTH2_ENV to the node oauth2 env file}
    volumes:
      - ${SPARKNET_IDENTITY_DIR:?set SPARKNET_IDENTITY_DIR to the node identity dir}:/etc/sparknet/identity:ro

  admin-nginx:
    image: nginx:1.27-alpine
    container_name: sparknet-admin-nginx
    restart: unless-stopped
    network_mode: host
    environment:
      SPARKNET_BIND: "${SPARKNET_ADMIN_BIND:?set the node admin bind address:port}"
      SPARKNET_ADMIN_ALT_BIND: "${SPARKNET_ADMIN_ALT_BIND:?set the node admin LAN bind}"
      SPARKNET_CONSOLE_UPSTREAM: "127.0.0.1:8099"
      SPARKNET_WEBUI_PORT: "8181"
      SPARKNET_TLS_CERT: "/etc/sparknet/identity/tls/server.crt"
      SPARKNET_TLS_KEY: "/etc/sparknet/identity/tls/server.key"
      SPARKNET_ADMIN_CA: "/etc/sparknet/identity/admin-ca/ca.crt"
    volumes:
      - ../../../webui/nginx.sso.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../../../webui/console/sparknet-menu.js:/etc/nginx/sparknet-menu.js:ro
      - ${SPARKNET_IDENTITY_DIR:?set SPARKNET_IDENTITY_DIR to the node identity dir}:/etc/sparknet/identity:ro
    depends_on:
      - open-webui
      - oauth2-proxy
